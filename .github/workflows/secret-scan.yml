name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The gitleaks CLI directly, not the gitleaks action: the action asks
      # organisations for a licence key. Version pinned exactly; the checksum
      # is the line for gitleaks_8.30.1_linux_x64.tar.gz in the release's
      # gitleaks_8.30.1_checksums.txt (read 20.10.2026). Change both together.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so a secret that was committed and later removed
          # is still found.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$tmp/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp" gitleaks
          sudo install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          test "$(gitleaks version)" = "${GITLEAKS_VERSION}"
      - name: Scan all commits for secrets (only counts in the log)
        run: |
          set -euo pipefail
          out="$(mktemp)"
          rc=0
          # The raw gitleaks output goes to a file only, never to the log:
          # --redact does not cover every diagnostic (an invalid
          # .gitleaksignore entry is printed in full). The log gets the exit
          # code and counts derived from the file, nothing else.
          # --diff-merges=separate: without it git log shows no diff for a
          # merge commit, and a secret added while resolving a conflict is
          # missed.
          gitleaks git . --log-opts="--all --diff-merges=separate" \
            --redact --no-banner --exit-code 1 > "$out" 2>&1 || rc=$?
          clean="$(mktemp)"
          perl -pe 's/\e\[[0-9;]*m//g' "$out" > "$clean"
          leaks="$(grep -o -E 'leaks found: [0-9]+' "$clean" | tail -n 1 | grep -o -E '[0-9]+$' || true)"
          # gitleaks stops reading the history on git stderr output (for
          # example a broken .gitattributes), logs it as ERR and exits 0.
          # A clean run logs only INF lines.
          bad="$(grep -c -E '^[^ ]+ (ERR|WRN|FTL) ' "$clean" || true)"
          # gitleaks reports a broken git source as "0 commits scanned" and
          # exits 0. Fail unless it scanned at least one commit. Empty and
          # deletion-only commits are not counted, so the number can be
          # lower than the commit count.
          n="$(grep -o -E '[0-9]+ commits scanned' "$clean" | tail -n 1 | cut -d' ' -f1 || true)"
          total="$(git rev-list --all --count)"
          echo "gitleaks exit: ${rc}, leaks found: ${leaks:-0}, error or warning lines: ${bad}, commits scanned: ${n:-none}, reachable: ${total}"
          test "$rc" -eq 0 || exit "$rc"
          if [ "$bad" -gt 0 ]; then
            echo "gitleaks logged error or warning lines: the scan may be incomplete" >&2
            exit 1
          fi
          test -n "$n" && test "$n" -gt 0 && test "$total" -gt 0
